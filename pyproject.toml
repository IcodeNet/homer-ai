[project]
name = "homer-ai"
version = "0.1.0"
description = "A beginner-friendly course that builds a small character-level LLM on Homer's Greek, then serves it to Claude over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "pytorch", "homer", "ancient-greek", "mcp", "tutorial"]
authors = [
    { name = "Byron Thanopoulos", email = "991694+IcodeNet@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mcp[cli]>=2.3.0",
    "tiktoken>=0.14.0",
    "torch>=2.15.0",
]

[project.scripts]
homer-train = "homer_ai.train_homer:main"
homer-serve = "homer_ai.homer_mcp_server:main"

[project.optional-dependencies]
# Only for the optional comparison cell in notebook 09_02: uv sync --extra rag
rag = [
    "sentence-transformers>=6.3.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "pytest>=8.0",
    "ruff>=0.17.6",
]

# On Linux (and so in CI), take the small CPU-only PyTorch instead of the
# multi-GB CUDA build. macOS and Windows wheels from PyPI are CPU already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
# the notebooks are generated by scripts/build_notebooks.py: never reformat them
exclude = ["notebooks/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
